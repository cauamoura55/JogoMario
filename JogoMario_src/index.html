<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./css/style.css">
    <script src="./js/script.js" defer></script>

    <title>Mario Jump</title>
</head>
<body>

    <div class="game-board">
      
        <img src="./images/pipe.png" class="pipe">
        <img src="./images/mario.gif" class="mario">
        <img src="./images/clouds.png" class="clouds">
        <img src="./images/clouds_2.1.png" class="clouds_2">
        <p class="startButton">PRESS [SPACE] TO START</p>
        <p class="retryButton">PRESS [F5] TO RETRY</p>
        <audio src="./media/mario-death-sound.mp3" class="marioDeathSound" preload="auto"></audio>
        <audio src="./media/mario-music.mp3" class="backgroundMusic" loop></audio>
    </div>

    
</body>
</html>
